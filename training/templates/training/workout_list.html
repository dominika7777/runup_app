<p><a href="{% url 'upload_gpx' %}">➕ Dodaj trening (GPX)</a></p>
<h1>Treningi</h1>
<ul>
	{% for w in workouts %}
	<li>
		<a href="{% url 'workout_detail' w.id %}">
			{{ w.date }} • {{ w.duration_s }} s • HRavg={{ w.avg_hr }} • HRmax={{
			w.max_hr }}
		</a>
	</li>
	{% empty %}
	<li>Brak treningów — wgraj GPX (komenda import_gpx).</li>
	{% endfor %}
</ul>
<p>
	<a href="{% url 'upload_gpx' %}">➕ Dodaj trening (GPX)</a> |
	<a href="{% url 'pace_calculator' %}">🧮 Kalkulator tempa</a>
  </p>
